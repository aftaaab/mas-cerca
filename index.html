<style>
/* Layout: one phone-width column. Quiz = one question per screen. Results = a long read built on two-colour dot strips: gold is Aftab (Abu Dhabi), teal is Jael (Lima). */
:root{
  --bg:#F3F0F6; --surface:#FFFFFF; --ink:#24182C; --muted:#6D6176; --line:#E1D9E7;
  --rose:#B3325B; --rose-soft:#F7DFE7;
  --gold:#A86E0C; --gold-soft:#F6E8CC;
  --teal:#13737A; --teal-soft:#D4EEEE;
  --good:#2D7A4D; --warn:#A6560F;
  --blend:multiply;
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --me:var(--rose); --me-soft:var(--rose-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16111B; --surface:#211A28; --ink:#F2EAF5; --muted:#A797B1; --line:#382D41;
    --rose:#EE7499; --rose-soft:#3E2231;
    --gold:#E4AA44; --gold-soft:#3B2F17;
    --teal:#5DC1C5; --teal-soft:#16383A;
    --good:#73CC94; --warn:#F0A55C;
    --blend:screen; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16111B; --surface:#211A28; --ink:#F2EAF5; --muted:#A797B1; --line:#382D41;
  --rose:#EE7499; --rose-soft:#3E2231;
  --gold:#E4AA44; --gold-soft:#3B2F17;
  --teal:#5DC1C5; --teal-soft:#16383A;
  --good:#73CC94; --warn:#F0A55C;
  --blend:screen; color-scheme:dark;
}
body[data-slot="a"]{--me:var(--gold);--me-soft:var(--gold-soft)}
body[data-slot="b"]{--me:var(--teal);--me-soft:var(--teal-soft)}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
a.btn{text-decoration:none}
.linkbox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.linkbox .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbox .btn{min-height:42px;padding:10px 18px;font-size:15px}
.linkin{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 13px var(--f-mono)}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  margin:0;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}

/* header: two clocks */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clocks{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.clock{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.clock .city{font:500 10px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clock .t{font:500 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.clock .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.clock.a{--c:var(--gold)} .clock.b{--c:var(--teal);align-items:flex-end}
.span{flex:1;min-width:24px;display:flex;align-items:center;gap:6px;color:var(--muted);font:500 10px var(--f-mono);letter-spacing:.06em}
.span::before,.span::after{content:"";flex:1;border-top:1.5px dotted var(--line)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex-shrink:0}
.lang button{border:0;background:transparent;font:500 12px var(--f-mono);letter-spacing:.04em;padding:6px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* generic */
.screen{display:flex;flex-direction:column;gap:22px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--f-body);padding:14px 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;min-height:50px;transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.text{background:transparent;color:var(--muted);padding-inline:6px;min-height:40px}
.btn.wide{width:100%}
.banner{padding:12px 14px;border-radius:12px;background:var(--rose-soft);font-size:14px}

/* welcome */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--f-display);font-size:clamp(46px,14vw,68px);line-height:.92;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--rose)}
.lead{font-size:17px;max-width:62ch}
.orbs{position:relative;height:84px;width:100%;max-width:100%}
.orb{position:absolute;top:6px;width:72px;height:72px;border-radius:50%;mix-blend-mode:var(--blend);opacity:.9}
.orb.a{background:var(--gold);left:0}
.orb.b{background:var(--teal)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{display:flex;gap:12px;align-items:baseline;font-size:15px}
.facts li::before{content:"";flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--rose);transform:translateY(-2px)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px}
.status .pip{width:10px;height:10px;border-radius:50%;background:var(--pc);flex-shrink:0}
.status.a{--pc:var(--gold)} .status.b{--pc:var(--teal)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--rose));border-radius:3px;transition:width .4s}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-pick button{padding:22px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:400 26px var(--f-display);display:flex;flex-direction:column;align-items:center;gap:10px}
.who-pick button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--pc)}
.who-pick .a{--pc:var(--gold)} .who-pick .b{--pc:var(--teal)}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.seg{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--me)}
.savestate{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.savestate.fail{color:var(--warn)}
.qtext{font-weight:600;font-size:clamp(22px,6.2vw,28px);line-height:1.22;letter-spacing:-.005em;text-wrap:balance}
.intro h2{font-family:var(--f-display);font-size:clamp(40px,12vw,56px);line-height:.95}
.intro p{font-size:18px;max-width:52ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:52px;transition:border-color .15s, background .15s}
.opt::before{content:"";flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);transition:all .15s}
.opt.sq::before{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--me);background:var(--me-soft)}
.opt[aria-pressed="true"]::before{border-color:var(--me);background:var(--me);box-shadow:inset 0 0 0 3px var(--surface)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{aspect-ratio:1/1;max-width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:500 20px var(--f-mono);cursor:pointer;transition:all .15s}
.sc[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:var(--surface)}
.ends{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}
.ends span:last-child{text-align:right}
textarea{width:100%;min-height:150px;resize:vertical;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:400 17px/1.5 var(--f-body)}
textarea:focus{outline:none;border-color:var(--me)}
.ynm{display:flex;flex-direction:column}
.ynm-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.ynm-row:first-child{padding-top:0}
.ynm-row .lbl{font-weight:500}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.seg3 button[aria-pressed="true"][data-v="y"]{background:var(--me);border-color:var(--me);color:var(--surface)}
.seg3 button[aria-pressed="true"][data-v="m"]{background:var(--me-soft);border-color:var(--me)}
.seg3 button[aria-pressed="true"][data-v="n"]{background:var(--line);border-color:var(--muted)}
.nav{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.nav .spacer{flex:1}
.counter{font:500 12px var(--f-mono);color:var(--muted)}

/* waiting */
.wait .orbs .orb.b{animation:drift 3.6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-18px)}}
.confirm{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}

/* results */
.rhero{display:flex;flex-direction:column;gap:16px}
.rhero h1{font-family:var(--f-display);font-size:clamp(44px,13vw,64px);line-height:.95}
.rhero h1 .amp{color:var(--rose)}
.rhero h1 .n.a{color:var(--gold)} .rhero h1 .n.b{color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .v{font:400 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font:500 12px var(--f-mono);color:var(--muted)}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.who{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.who::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.who.a{--pc:var(--gold)} .who.b{--pc:var(--teal)}
.who .me{font-weight:400;color:var(--muted)}
.rs{display:flex;flex-direction:column;gap:16px;padding-top:26px;border-top:1px solid var(--line)}
.rs > h2{font-family:var(--f-display);font-size:32px;line-height:1.05}
.rs > .sub{color:var(--muted);font-size:15px;margin-top:-8px;max-width:60ch}
.items{display:flex;flex-direction:column;gap:18px}
.item{display:flex;flex-direction:column;gap:9px;min-width:0}
.item .t{font-weight:600;font-size:15px}
.item .tip{font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:baseline}
.item .tip b{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rose);flex-shrink:0}
.pill{display:inline-block;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--ink);vertical-align:2px;margin-left:6px}
.pill.ok{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good)}
.pill.part{background:color-mix(in srgb, var(--warn) 16%, transparent);color:var(--warn)}
.strip{display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.tick{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--line);transform:translate(-50%,-50%);left:calc(10px + (100% - 20px) * var(--x))}
.dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);left:calc(10px + (100% - 20px) * var(--x));border:2px solid var(--bg)}
.dot.a{background:var(--gold)} .dot.b{background:var(--teal)}
.dot.ab{background:linear-gradient(90deg,var(--gold) 50%,var(--teal) 50%)}
.strip .ends{font-size:12.5px}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:10px;align-items:baseline;font-size:15px;min-width:0}
.line .who{flex-shrink:0;min-width:58px;font-size:14px}
.line .val{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;padding:5px 11px;border-radius:999px;font-size:14px;background:var(--cs,var(--line));line-height:1.35}
.chip.a{--cs:var(--gold-soft)} .chip.b{--cs:var(--teal-soft)} .chip.both{--cs:var(--rose-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .k{font-size:12.5px;color:var(--muted)}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.pips i{height:6px;border-radius:3px;background:var(--line)}
.pips.a i.on{background:var(--gold)} .pips.b i.on{background:var(--teal)}
.note{padding:14px 16px;border-radius:14px;background:var(--rose-soft);font-size:15px;display:flex;flex-direction:column;gap:6px}
.quote{margin:0;display:flex;flex-direction:column;gap:6px}
.quote blockquote{margin:0;font-size:16.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:14px;border-left:2px solid var(--pc,var(--line))}
.quote.a{--pc:var(--gold)} .quote.b{--pc:var(--teal)}
.quote figcaption{font-size:13px;color:var(--muted)}
.letter{padding:22px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.letter .from{font-family:var(--f-display);font-size:26px}
.letter p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.6}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font:500 16px var(--f-mono);color:var(--muted)}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.guess{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-bottom:1px solid var(--line)}
.guess:last-child{border-bottom:0}
.guess .t{font-weight:600;font-size:15px}
.guess .g{font-size:14px;color:var(--muted)}
.guess .g b{color:var(--ink);font-weight:500}
.ai{display:flex;flex-direction:column;gap:14px}
.ai .sum{font-size:17px;line-height:1.55}
.ai h3{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.ai ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.thinking::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rose);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.foot{display:flex;flex-direction:column;gap:12px;padding-top:26px;border-top:1px solid var(--line)}

@media (max-width:360px){ .stats{grid-template-columns:1fr} .pair{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

/* ---------- state ---------- */
const S = {
  slot: null, room: null, lang: "en", store: null,
  docs: { a: null, b: null }, got: { a: false, b: false }, ready: false,
  answers: {}, pos: 0, done: false, touched: false,
  readOnly: false, view: "loading", saveState: "", redoConfirm: false,
  lastPartner: "", lastMine: "", copied: ""
};

/* ---------- storage (per-device conveniences only) ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- text ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function fill(str, speaker, vars){
  const sp = speaker || S.slot || "a";
  let out = String(str)
    .replace(/\[([^|\]]*)\|([^\]]*)\]/g, (m, x, y) => (sp === "a" ? x : y))
    .replace(/\{p\}/g, NAMES[other(sp)])
    .replace(/\{me\}/g, NAMES[sp]);
  if (vars) for (const k in vars) out = out.split("{" + k + "}").join(vars[k]);
  return out;
}
function tx(obj, speaker, lang){ if (!obj) return ""; const l = lang || S.lang; return fill(obj[l] != null ? obj[l] : obj.en, speaker); }
function tr(key, vars, speaker){ const o = U[key]; if (!o) return key; return fill(o[S.lang] != null ? o[S.lang] : o.en, speaker || S.slot, vars); }

/* ---------- answers ---------- */
function getAns(slot, id){
  if (slot === S.slot) return S.answers[id];
  const d = S.docs[slot]; return d && d.answers ? d.answers[id] : undefined;
}
function isAnswered(q, src){
  const v = (src || S.answers)[q.id];
  if (v === undefined || v === null) return false;
  if (q.type === "text") return q.optional ? true : String(v).trim().length > 0;
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "ynm") return YNM.every(it => v[it.k]);
  return true;
}
function answeredCount(){ return ALLQ.filter(q => isAnswered(q)).length; }
function optLabel(q, k, speaker, lang){
  if (q.persp) {
    const n = norm(speaker, k);
    if (n === "a" || n === "b") return NAMES[n];
  }
  const o = (q.opts || []).find(x => x.k === k);
  return o ? tx(o, speaker, lang) : "";
}
function norm(slot, k){ return k === "self" ? slot : k === "partner" ? other(slot) : k; }

/* ---------- links ---------- */
function parseHash(){
  let h = location.hash.replace(/^#/, "");
  try { h = decodeURIComponent(h); } catch (e) {}
  const m = h.match(/^([A-Za-z0-9_-]{16,64})\.(a|b)$/);
  return m ? { room: m[1], slot: m[2] } : null;
}
function newRoom(){
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  return btoa(String.fromCharCode.apply(null, b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function linkFor(room, slot){ return location.origin + location.pathname + "#" + room + "." + slot; }
window.addEventListener("hashchange", () => location.reload());

/* ---------- Firebase ---------- */
async function connect(){
  const base = "https://www.gstatic.com/firebasejs/" + FIREBASE_VERSION + "/";
  const appMod = await import(base + "firebase-app.js");
  const fsMod = await import(base + "firebase-firestore.js");
  const fdb = fsMod.getFirestore(appMod.initializeApp(FIREBASE_CONFIG));
  return {
    watch: (path, next, err) => fsMod.onSnapshot(fsMod.doc(fdb, path), s => next(s.exists() ? s.data() : null), err),
    set: (path, data) => fsMod.setDoc(fsMod.doc(fdb, path), data)
  };
}
function docPath(slot){ return "rooms/" + S.room + "/answers/" + slot; }

async function init(){
  const h = parseHash();
  const l = lsGet("mc_lang");
  S.lang = (l === "en" || l === "es") ? l
    : (h && h.slot === "b") ? "es"
    : (h && h.slot === "a") ? "en"
    : ((navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en");
  document.documentElement.lang = S.lang;
  renderTop(); render();
  setInterval(updateClocks, 20000);
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PASTE") === 0) { S.view = "config"; render(); return; }
  if (!h) { S.room = lsGet("mc_room"); S.view = "setup"; render(); return; }
  S.room = h.room; S.slot = h.slot;
  if (h.slot === "a") lsSet("mc_room", h.room);
  document.body.dataset.slot = S.slot;
  renderTop(); render();
  try { S.store = await connect(); }
  catch (e) { S.view = "error"; render(); return; }
  ["a", "b"].forEach(slot => S.store.watch(docPath(slot), data => onDoc(slot, data), () => { S.view = "error"; render(); }));
}

function onDoc(slot, data){
  S.docs[slot] = data || null; S.got[slot] = true;
  if (!S.got.a || !S.got.b) return;
  const firstLoad = !S.ready; S.ready = true;
  const d = S.docs;
  let mineChanged = false;
  if (!S.touched) {
    const m = d[S.slot];
    const mj = JSON.stringify(m || null);
    if (mj !== S.lastMine) { mineChanged = true; S.lastMine = mj; }
    if (m) { S.answers = JSON.parse(JSON.stringify(m.answers || {})); S.pos = Math.min(m.pos || 0, FLOW.length - 1); S.done = !!m.done; }
  }
  const pj = JSON.stringify(d[other(S.slot)] || null);
  const partnerChanged = pj !== S.lastPartner; S.lastPartner = pj;
  if (S.view === "quiz") return;
  const v = decideView();
  if (firstLoad || v !== S.view || partnerChanged || mineChanged) { S.view = v; render(); }
}

function decideView(){
  const p = S.docs[other(S.slot)];
  if (S.done && p && p.done) return "results";
  if (S.done) return "waiting";
  return "welcome";
}

/* ---------- saving: one write at a time ---------- */
let saving = false, saveAgain = false;
async function save(){
  if (!S.store || !S.slot) return;
  if (saving) { saveAgain = true; return; }
  saving = true; setSaveState("saving");
  try {
    await S.store.set(docPath(S.slot), {
      answers: S.answers, pos: S.pos, done: S.done,
      count: answeredCount(), total: QCOUNT, lang: S.lang,
      updatedAt: new Date().toISOString()
    });
    setSaveState("saved");
  } catch (e) {
    setSaveState("fail");
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; save(); }
  }
}
function setSaveState(s){
  S.saveState = s;
  const el = document.getElementById("savestate");
  if (el) { el.textContent = s ? tr(s === "fail" ? "saveFail" : s) : ""; el.className = "savestate" + (s === "fail" ? " fail" : ""); }
}

/* ---------- sharing links ---------- */
async function copyLink(slot){
  const url = linkFor(S.room, slot);
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {}
  if (!ok) { const i = document.getElementById("link_" + slot); if (i) { i.focus(); i.select(); try { document.execCommand("copy"); } catch (e) {} } }
  S.copied = slot; render();
  setTimeout(() => { S.copied = ""; if (["setup","welcome","waiting"].includes(S.view)) render(); }, 1800);
}
function shareLink(slot){
  const url = linkFor(S.room, slot);
  const text = slot === "b" ? U.shareA.es : U.shareA.en;
  if (navigator.share) navigator.share({ title: "Más Cerca", text, url }).catch(() => {});
  else copyLink(slot);
}
function linkBox(slot, label){
  const url = linkFor(S.room, slot);
  return `<div class="linkbox"><span class="who ${slot}">${esc(label || tr("linkFor", { name: NAMES[slot] }))}</span>
    <input class="linkin" id="link_${slot}" readonly value="${esc(url)}" aria-label="${esc(tr("linkFor", { name: NAMES[slot] }))}">
    <div class="row"><button class="btn ghost" data-act="copy" data-slot="${slot}">${esc(S.copied === slot ? tr("copied") : tr("copy"))}</button>${navigator.share ? `<button class="btn ghost" data-act="share" data-slot="${slot}">${esc(tr("share"))}</button>` : ""}</div></div>`;
}
function sendBlock(){ return S.slot === "a" ? linkBox("b", tr("sendHer")) : ""; }

/* ---------- header ---------- */
function timeIn(tz){
  try { return new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz }).format(new Date()); }
  catch (e) { return "--:--"; }
}
function renderTop(){
  const top = document.getElementById("top");
  top.innerHTML =
    `<div class="clocks" aria-label="Abu Dhabi and Lima local times">
       <div class="clock a"><span class="city">${esc(tr("ad"))}</span><span class="t" id="tA">${timeIn("Asia/Dubai")}</span></div>
       <div class="span">${esc(tr("apart"))}</div>
       <div class="clock b"><span class="city">${esc(tr("lima"))}</span><span class="t" id="tB">${timeIn("America/Lima")}</span></div>
     </div>
     <div class="lang" role="group" aria-label="Language">
       <button data-lang="en" aria-pressed="${S.lang === "en"}">EN</button>
       <button data-lang="es" aria-pressed="${S.lang === "es"}">ES</button>
     </div>`;
}
function updateClocks(){
  const a = document.getElementById("tA"), b = document.getElementById("tB");
  if (a) a.textContent = timeIn("Asia/Dubai");
  if (b) b.textContent = timeIn("America/Lima");
}
document.getElementById("top").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b) return;
  S.lang = b.dataset.lang; lsSet("mc_lang", S.lang);
  document.documentElement.lang = S.lang;
  renderTop(); render();
});

/* ---------- views ---------- */
const app = document.getElementById("app");

function render(){
  const v = S.view; let h = "";

    body = `<div class="opts" role="group">${q.opts.map(o => `<button class="opt sq" data-act="toggle" data-k="${o.k}" aria-pressed="${arr.includes(o.k)}">${esc(tx(o))}</button>`).join("")}</div>`;
  } else if (q.type === "text") {
    body = `${q.optional ? `<span class="counter">${esc(tr("optional"))}</span>` : ""}
      <textarea id="ta_${q.id}" data-q="${q.id}" placeholder="${esc(tr("place"))}" maxlength="2000">${esc(v || "")}</textarea>`;
  } else if (q.type === "ynm") {
    const obj = v || {};
    body = `<div class="ynm">${YNM.map(it => `<div class="ynm-row"><span class="lbl">${esc(tx(it))}</span>
      <div class="seg3" role="group">
        <button data-act="ynm" data-i="${it.k}" data-v="y" aria-pressed="${obj[it.k] === "y"}">${esc(tr("yes"))}</button>
        <button data-act="ynm" data-i="${it.k}" data-v="m" aria-pressed="${obj[it.k] === "m"}">${esc(tr("maybe"))}</button>
        <button data-act="ynm" data-i="${it.k}" data-v="n" aria-pressed="${obj[it.k] === "n"}">${esc(tr("no"))}</button>
      </div></div>`).join("")}</div>`;
  }

  let counter = "";
  if (q.type === "multi") counter = `<span class="counter" id="cnt">${esc(tr("chosen", { n: (Array.isArray(v) ? v.length : 0), max: q.max }))}</span>`;
  if (q.type === "ynm") counter = `<span class="counter" id="cnt">${Object.keys(v || {}).length} / ${YNM.length}</span>`;
  const skipBtn = (q.type === "text" && q.optional) ? `<button class="btn ghost" data-act="skip">${esc(tr("skip"))}</button>` : "";
  let canNext;
  if (q.type === "text") canNext = q.optional ? true : String(v || "").trim().length > 0;
  else canNext = isAnswered(q);
  const nav = needsNext ? `<div class="nav">${counter}<span class="spacer"></span>${skipBtn}
      <button class="btn" id="nextBtn" data-act="next" ${canNext ? "" : "disabled"}>${esc(isLast ? tr("finish") : tr("next"))} →</button></div>` : "";

  return `<section class="screen">${head}
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">${esc(tx(sec.title))} · ${idx}/${sec.qs.length}</span>
      <h2 class="qtext">${esc(tx(q.q))}</h2>
    </div>

  </section>`;
}

/* ---------- results helpers ---------- */
function inSync(q){
  const V = S.slot, P = other(V);
  const a = getAns(V, q.id), b = getAns(P, q.id);
  if (a == null || b == null || a === "" || b === "") return null;
  if (q.type === "scale") return Math.abs(a - b) <= 1;
  if (q.type === "single") {
    if (q.persp) return norm(V, a) === norm(P, b);
    if (a === b) return true;
    if (q.ord) { const i = q.ord.indexOf(a), j = q.ord.indexOf(b); if (i >= 0 && j >= 0) return Math.abs(i - j) <= 1; }
    return false;
  }
  if (q.type === "multi") return Array.isArray(a) && Array.isArray(b) && a.some(x => b.includes(x));
  return null;
}
function strip(q){
  const V = S.slot, P = other(V);
  const a = getAns(V, q.id), b = getAns(P, q.id);
  const x = v => ((v - 1) / 4).toFixed(3);
  let ticks = ""; for (let i = 1; i <= 5; i++) ticks += `<span class="tick" style="--x:${x(i)}"></span>`;
  let dots = "";
  if (a != null && b != null && a === b) dots = `<span class="dot ab" style="--x:${x(a)}" title="${esc(NAMES.a)} & ${esc(NAMES.b)}: ${a}"></span>`;
  else {
    if (b != null) dots += `<span class="dot ${P}" style="--x:${x(b)}" title="${esc(NAMES[P])}: ${b}"></span>`;
    if (a != null) dots += `<span class="dot ${V}" style="--x:${x(a)}" title="${esc(NAMES[V])}: ${a}"></span>`;
  }
  return `<div class="strip"><div class="track">${ticks}${dots}</div>
    <div class="ends"><span>${esc(tx(q.lo, V))}</span><span>${esc(tx(q.hi, V))}</span></div></div>`;
}
function whoTag(slot){ return `<span class="who ${slot}">${esc(NAMES[slot])}${slot === S.slot ? ` <span class="me">(${esc(tr("you"))})</span>` : ""}</span>`; }
function chipsFor(q, slot, keys, cls){
  return `<div class="chips">${(keys || []).map(k => `<span class="chip ${cls || slot}">${esc(optLabel(q, k, slot))}</span>`).join("")}</div>`;
}
function valFor(q, slot){
  const v = getAns(slot, q.id);
  if (v == null || v === "") return `<span class="muted">—</span>`;
  if (q.type === "multi") return chipsFor(q, slot, v);
  if (q.type === "scale") return `${v} / 5`;
  return esc(optLabel(q, v, slot));
}
function lines(q){
  const V = S.slot, P = other(V);
  return `<div class="lines">
    <div class="line">${whoTag(V)}<span class="val">${valFor(q, V)}</span></div>
    <div class="line">${whoTag(P)}<span class="val">${valFor(q, P)}</span></div></div>`;
}
function quote(slot, text, caption){
  if (!text || !String(text).trim()) return "";
  return `<figure class="quote ${slot}"><figcaption>${caption ? esc(caption) : esc(NAMES[slot])}</figcaption><blockquote>${esc(text)}</blockquote></figure>`;
}
function pips(slot, v){ let h = ""; for (let i = 1; i <= 5; i++) h += `<i class="${v >= i ? "on" : ""}"></i>`; return `<div class="pips ${slot}">${h}</div>`; }

function knowScore(guesser){
  const target = other(guesser); let score = 0, total = 0; const rows = [];
  ALLQ.filter(q => q.guess).forEach(q => {
    const g = getAns(guesser, q.id), act = getAns(target, q.guess);
    if (g == null || act == null) return;
    total++;
    let mark = "miss";
    if (q.type === "multi") {
      const ga = g || [], aa = act || [];
      const ov = ga.filter(x => aa.includes(x)).length;
      if (ov === aa.length && ov === ga.length) { mark = "spot"; score += 1; }
      else if (ov > 0) { mark = "part"; score += 0.5; }
    } else if (g === act) { mark = "spot"; score += 1; }
    rows.push({ q, g, act, mark });
  });
  return { score, total, rows };
}
function fmtScore(n){ const w = Math.floor(n); return (n - w) >= 0.5 ? (w ? w + "½" : "½") : String(w); }

function mutualDesire(){
  const a = getAns("a", "d_ynm") || {}, b = getAns("b", "d_ynm") || {};
  const both = [], explore = [];
  YNM.forEach(it => {
    const x = a[it.k], y = b[it.k];
    if (!x || !y || x === "n" || y === "n") return;
    if (x === "y" && y === "y") both.push(it); else explore.push(it);
  });
  return { both, explore };
}

/* ---------- results view ---------- */
function vResults(){
  const V = S.slot, P = other(V);
  const comparable = ALLQ.filter(q => (q.cat === "trait" || q.cat === "pref" || q.cat === "rating") && q.type !== "text");
  let sN = 0, sT = 0; comparable.forEach(q => { const r = inSync(q); if (r !== null) { sT++; if (r) sN++; } });
  const kV = knowScore(V), kP = knowScore(P);
  const ratio = sT ? sN / sT : 0;
  const orbGap = Math.round(72 * (1 - ratio * 0.7));

  /* hero */
  let h = `<section class="screen rhero">
    <span class="eyebrow">${esc(tr("rKicker"))}</span>
    <h1><span class="n a">${esc(NAMES.a)}</span> <span class="amp">&amp;</span> <span class="n b">${esc(NAMES.b)}</span></h1>
    <div class="orbs" aria-hidden="true" style="height:84px"><span class="orb a"></span><span class="orb b" style="left:${orbGap}px"></span></div>
    <div class="stats">
      <div class="stat"><span class="v">${sN}<small> / ${sT}</small></span><span class="k">${esc(tr("sync"))}</span></div>
      <div class="stat"><span class="v">${fmtScore(kV.score)}<small> / ${kV.total}</small></span><span class="k">${esc(tr("youKnow"))}</span></div>
      <div class="stat"><span class="v">${fmtScore(kP.score)}<small> / ${kP.total}</small></span><span class="k">${esc(tr("knowsYou"))}</span></div>
    </div>
    <div class="legend">${whoTag(V)}${whoTag(P)}</div>
  </section>`;

  /* right now */
  const mood = ["m_mood","m_stress","m_energy","m_loved","m_close"].map(id => QMAP[id]);
  const card = slot => `<div class="card">${whoTag(slot)}
      ${mood.map(q => `<div class="meter"><span class="k">${esc(tx(q.short, slot))} · ${getAns(slot, q.id) || "–"}/5</span>${pips(slot, getAns(slot, q.id) || 0)}</div>`).join("")}
      <div class="meter"><span class="k">${esc(tx(QMAP.m_drain.short, slot))}</span>${chipsFor(QMAP.m_drain, slot, getAns(slot, "m_drain"))}</div>
      <div class="meter"><span class="k">${esc(tx(QMAP.m_help.short, slot))}</span><span>${esc(optLabel(QMAP.m_help, getAns(slot, "m_help"), slot))}</span></div>
    </div>`;
  const pm = getAns(P, "m_mood"), ps = getAns(P, "m_stress"), vm = getAns(V, "m_mood"), vs = getAns(V, "m_stress");
  let notes = "";
  if (pm <= 2 || ps >= 4) notes += `<p>${esc(tr("carrying", { help: optLabel(QMAP.m_help, getAns(P, "m_help"), P).toLowerCase() }))}</p>`;
  if (vm <= 2 || vs >= 4) notes += `<p>${esc(tr("selfCare"))}</p>`;
  if ((pm <= 2 && ps >= 4) || (vm <= 2 && vs >= 4)) notes += `<p>${esc(tr("support"))}</p>`;
  h += `<section class="rs"><h2>${esc(tr("hNow"))}</h2><p class="sub">${esc(tr("hNowSub"))}</p>
    <div class="pair">${card(V)}${card(P)}</div>
    ${notes ? `<div class="note">${notes}</div>` : ""}</section>`;

  /* connected + work on */
  const conn = [], work = [];
  ALLQ.forEach(q => {
    if (q.cat !== "rating" && q.cat !== "pref") return;
    const r = inSync(q); if (r === null) return;
    const a = getAns(V, q.id), b = getAns(P, q.id);
    const show = q.type === "scale" ? strip(q) : lines(q);
    if (q.cat === "rating") {
      const low = a <= 2 || b <= 2;
      if (low) work.push({ q, show, tip: (q.tip && (q.tip.low || q.tip.gap)) || U.genericGap, w: 0 });
      else if (!r) work.push({ q, show, tip: (q.tip && (q.tip.gap || q.tip.low)) || U.genericGap, w: 1 });
      else if (a >= 4 && b >= 4) conn.push({ q, show, label: tr("bothHigh") });
    } else {
      if (r) {
        let body = show;
        if (q.type === "multi") body = `<div class="lines"><div class="line"><span class="who" style="--pc:var(--rose)">${esc(tr("bothSaid"))}</span><span class="val">${chipsFor(q, V, a.filter(x => b.includes(x)), "both")}</span></div></div>`;
        else if (q.type === "single" && (a === b || (q.persp && norm(V, a) === norm(P, b)))) body = `<div class="lines"><div class="line"><span class="who" style="--pc:var(--rose)">${esc(tr("bothSaid"))}</span><span class="val">${esc(optLabel(q, a, V))}</span></div></div>`;
        conn.push({ q, show: body });
      } else work.push({ q, show, tip: (q.tip && q.tip.gap) || U.genericGap, w: 2 });
    }
  });
  const sa = getAns(V, "u_strength") || [], sb = getAns(P, "u_strength") || [];
  const sharedStr = sa.filter(x => sb.includes(x));
  if (sharedStr.length) conn.unshift({ q: QMAP.u_strength, show: chipsFor(QMAP.u_strength, V, sharedStr, "both"), label: tr("bothSaid") });
  const da = getAns(V, "u_drain") || [], dbb = getAns(P, "u_drain") || [];
  const sharedDrain = da.filter(x => dbb.includes(x) && x !== "none");
  if (sharedDrain.length) work.push({ q: QMAP.u_drain, show: chipsFor(QMAP.u_drain, V, sharedDrain, "both"), tip: U.inWayTip, w: 1 });
  work.sort((x, y) => x.w - y.w);

  h += `<section class="rs"><h2>${esc(tr("hConn"))}</h2><p class="sub">${esc(tr("hConnSub"))}</p>
    <div class="items">${conn.length ? conn.map(c => `<div class="item"><span class="t">${esc(tx(c.q.short, V))}${c.label ? ` <span class="pill ok">${esc(c.label)}</span>` : ""}</span>${c.show}</div>`).join("") : `<p class="muted">${esc(tr("connNone"))}</p>`}</div></section>`;

  h += `<section class="rs"><h2>${esc(tr("hWork"))}</h2><p class="sub">${esc(tr("hWorkSub"))}</p>
    <div class="items">${work.length ? work.map(c => `<div class="item"><span class="t">${esc(tx(c.q.short, V))}</span>${c.show}<p class="tip"><b>${esc(tr("tryL"))}</b><span>${esc(tx(c.tip, V))}</span></p></div>`).join("") : `<p class="muted">${esc(tr("workNone"))}</p>`}</div></section>`;

  /* how you're wired */
  const traits = ALLQ.filter(q => q.cat === "trait");
  h += `<section class="rs"><h2>${esc(tr("hWired"))}</h2><p class="sub">${esc(tr("hWiredSub"))}</p>
    <div class="items">${traits.map(q => {
      const r = inSync(q);
      const pill = r === true ? ` <span class="pill ok">${esc(q.type === "scale" && getAns(V, q.id) !== getAns(P, q.id) ? tr("close") : tr("same"))}</span>` : "";
      return `<div class="item"><span class="t">${esc(tx(q.short, V))}${pill}</span>${q.type === "scale" ? strip(q) : lines(q)}</div>`;
    }).join("")}</div></section>`;

  /* how to love each other */
  const needsRows = slot => `
      <div class="item"><span class="t">${esc(tx(QMAP.p_love.short, slot))}</span>${chipsFor(QMAP.p_love, slot, getAns(slot, "p_love"))}</div>
      <div class="item"><span class="t">${esc(tx(QMAP.h_more.short, slot))}</span>${chipsFor(QMAP.h_more, slot, getAns(slot, "h_more"))}</div>
      <div class="item"><span class="t">${esc(tx(QMAP.h_support.short, slot))}</span><span>${esc(optLabel(QMAP.h_support, getAns(slot, "h_support"), slot))}</span></div>`;
  h += `<section class="rs"><h2>${esc(tr("hLove"))}</h2>
    <h3 class="eyebrow" style="color:var(--${P === "a" ? "gold" : "teal"})">${esc(tr("needsT"))}</h3>
    <div class="items">${needsRows(P)}
      ${quote(P, getAns(P, "h_love_most"), tr("lovesYou"))}
      ${quote(P, getAns(P, "h_wish"), tr("wishes"))}
    </div>
    <details><summary>${esc(tr("told"))}</summary><div class="in">${needsRows(V)}
      ${quote(V, getAns(V, "h_love_most"), tr("youLove"))}
      ${quote(V, getAns(V, "h_wish"), tr("youWish"))}</div></details>
  </section>`;

  /* desire */
  const md = mutualDesire();
  h += `<section class="rs"><h2>${esc(tr("hDesire"))}</h2><p class="sub">${esc(tr("hDesireSub"))}</p>
    <div class="items">
      <div class="item"><span class="t">${esc(tx(QMAP.d_satisf.short, V))}</span>${strip(QMAP.d_satisf)}</div>
      <div class="item"><span class="t">${esc(tx(QMAP.d_talk.short, V))}</span>${strip(QMAP.d_talk)}</div>
      <div class="item"><span class="t">${esc(tx(QMAP.d_often.short, V))}</span>${lines(QMAP.d_often)}</div>
      <div class="item"><span class="t">${esc(tx(QMAP.d_init.short, V))}</span>${lines(QMAP.d_init)}</div>
      ${md.both.length || md.explore.length ? `
        ${md.both.length ? `<div class="item"><span class="t">${esc(tr("bothWant"))}</span><div class="chips">${md.both.map(it => `<span class="chip both">${esc(tx(it, V))}</span>`).join("")}</div></div>` : ""}
        ${md.explore.length ? `<div class="item"><span class="t">${esc(tr("explore"))}</span><div class="chips">${md.explore.map(it => `<span class="chip">${esc(tx(it, V))}</span>`).join("")}</div></div>` : ""}
      ` : `<p class="muted">${esc(tr("noneMutual"))}</p>`}
      <div class="item"><span class="t">${esc(tr("desiredP"))}</span>${chipsFor(QMAP.d_desired, P, getAns(P, "d_desired"))}</div>
      <div class="item"><span class="t">${esc(tr("desiredMe"))}</span>${chipsFor(QMAP.d_desired, V, getAns(V, "d_desired"))}</div>
      ${quote(P, getAns(P, "d_wish"))}${quote(V, getAns(V, "d_wish"))}
    </div></section>`;

  /* know each other */
  const guessBlock = (k, guesser) => k.rows.map(r => {
    const target = other(guesser);
    const lbl = v => Array.isArray(v) ? v.map(x => optLabel(r.q, x, target)).join(", ") : optLabel(r.q, v, target);
    const cls = r.mark === "spot" ? "ok" : r.mark === "part" ? "part" : "";
    return `<div class="guess"><span class="t">${esc(tx(QMAP[r.q.guess].short, target))} <span class="pill ${cls}">${esc(tr(r.mark))}</span></span>
      <span class="g">${esc(guesser === S.slot ? tr("youGuessed") : tr("pGuessed"))}: <b>${esc(lbl(r.g))}</b></span>
      ${r.mark !== "spot" ? `<span class="g">${esc(tr("actual"))}: <b>${esc(lbl(r.act))}</b></span>` : ""}</div>`;
  }).join("");
  h += `<section class="rs"><h2>${esc(tr("hKnow"))}</h2>
    <div class="card"><span class="eyebrow" style="color:var(--${V === "a" ? "gold" : "teal"})">${esc(tr("youOn"))} · ${fmtScore(kV.score)}/${kV.total}</span><div>${guessBlock(kV, V)}</div></div>
    <div class="card"><span class="eyebrow" style="color:var(--${P === "a" ? "gold" : "teal"})">${esc(tr("pOn"))} · ${fmtScore(kP.score)}/${kP.total}</span><div>${guessBlock(kP, P)}</div></div>
  </section>`;

  /* future */
  h += `<section class="rs"><h2>${esc(tr("hFuture"))}</h2><div class="items">
    <div class="item"><span class="t">${esc(tx(QMAP.f_close.short, V))}</span>${strip(QMAP.f_close)}</div>
    ${["f_when","f_where","f_visit"].map(id => `<div class="item"><span class="t">${esc(tx(QMAP[id].short, V))}</span>${lines(QMAP[id])}</div>`).join("")}
    ${["f_year","f_soon"].map(id => {
      const qa = quote(V, getAns(V, id)), qb = quote(P, getAns(P, id));
      return qa || qb ? `<div class="item"><span class="t">${esc(tx(QMAP[id].short, V))}</span>${qb}${qa}</div>` : "";
    }).join("")}
  </div></section>`;

  /* words */
  const wordIds = ["p_proud","m_unsaid","h_hurt"];
  const wordsHtml = wordIds.map(id => {
    const qa = quote(V, getAns(V, id)), qb = quote(P, getAns(P, id));
    return qa || qb ? `<div class="item"><span class="t">${esc(tx(QMAP[id].short, V))}</span>${qb}${qa}</div>` : "";
  }).join("");
  const pNote = getAns(P, "l_note"), vNote = getAns(V, "l_note");
  h += `<section class="rs"><h2>${esc(tr("hWords"))}</h2><div class="items">${wordsHtml}</div>
    ${pNote ? `<div class="letter"><span class="from">${esc(tr("letterT"))}</span><p>${esc(pNote)}</p></div>` : ""}
    ${vNote ? `<details><summary>${esc(tr("yourNote"))}</summary><div class="in"><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(vNote)}</p></div></details>` : ""}
  </section>`;

  h += `<section class="foot"><p class="muted">${esc(tr("againT"))}</p>${redoBlock()}</section>`;
  return h;
}

/* ---------- quiz navigation ---------- */
function curQ(){ const f = FLOW[S.pos]; return f && f.kind === "q" ? f.q : null; }
function go(pos){
  S.pos = Math.max(0, Math.min(FLOW.length - 1, pos));
  S.touched = true;
  render(); window.scrollTo(0, 0);
  save();
}
function next(){
  const q = curQ();
  if (q && q.type === "text" && q.optional && S.answers[q.id] === undefined) S.answers[q.id] = "";
  if (q && !isAnswered(q)) return;
  if (S.pos >= FLOW.length - 1) return finish();
  go(S.pos + 1);
}
function finish(){
  const open = FLOW.findIndex(f => f.kind === "q" && !isAnswered(f.q));
  if (open >= 0) { go(open); return; }
  S.done = true; S.touched = true; S.redoConfirm = false;
  save();
  S.view = decideView(); render(); window.scrollTo(0, 0);
}
function refreshControls(q){
  const v = S.answers[q.id];
  if (q.type === "multi") {
    const arr = v || [];
    app.querySelectorAll('[data-act="toggle"]').forEach(b => b.setAttribute("aria-pressed", String(arr.includes(b.dataset.k))));
    const c = document.getElementById("cnt"); if (c) c.textContent = tr("chosen", { n: arr.length, max: q.max });
  }
  if (q.type === "ynm") {
    const obj = v || {};
    app.querySelectorAll('[data-act="ynm"]').forEach(b => b.setAttribute("aria-pressed", String(obj[b.dataset.i] === b.dataset.v)));
    const c = document.getElementById("cnt"); if (c) c.textContent = Object.keys(obj).length + " / " + YNM.length;
  }
  const nb = document.getElementById("nextBtn");
  if (nb && q.type !== "text") nb.disabled = !isAnswered(q);
}

let advanceTimer = null;
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const q = curQ();
  switch (act) {
    case "create": S.room = newRoom(); lsSet("mc_room", S.room); render(); break;
    case "copy": copyLink(el.dataset.slot); break;
    case "share": shareLink(el.dataset.slot); break;
    case "start":
      S.view = "quiz"; S.touched = true;
      if (S.pos >= FLOW.length - 1 && answeredCount() < QCOUNT) {
        const firstOpen = FLOW.findIndex(f => f.kind === "q" && !isAnswered(f.q));
        S.pos = firstOpen > 0 ? firstOpen : 0;
      }
      render(); window.scrollTo(0, 0); break;
    case "home":
      S.view = decideView(); render(); window.scrollTo(0, 0); break;
    case "back": clearTimeout(advanceTimer); go(S.pos - 1); break;
    case "next": clearTimeout(advanceTimer); next(); break;
    case "skip": if (q) { S.answers[q.id] = ""; S.touched = true; } next(); break;
    case "scale":
    case "pick": {
      if (!q) break;
      S.answers[q.id] = act === "scale" ? Number(el.dataset.v) : el.dataset.k;
      S.touched = true;
      app.querySelectorAll(`[data-act="${act}"]`).forEach(b => b.setAttribute("aria-pressed", String(b === el)));
      const nb = document.getElementById("nextBtn"); if (nb) nb.disabled = false;
      const at = S.pos; clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => { if (S.view === "quiz" && S.pos === at) next(); }, 300);
      break;
    }
    case "toggle": {
      if (!q) break;
      const arr = Array.isArray(S.answers[q.id]) ? S.answers[q.id].slice() : [];
      const k = el.dataset.k, i = arr.indexOf(k);
      if (i >= 0) arr.splice(i, 1); else { if (arr.length >= q.max) arr.shift(); arr.push(k); }
      S.answers[q.id] = arr; S.touched = true; refreshControls(q); break;
    }
    case "ynm": {
      if (!q) break;
      const obj = Object.assign({}, S.answers[q.id] || {});
      obj[el.dataset.i] = el.dataset.v;
      S.answers[q.id] = obj; S.touched = true; refreshControls(q); break;
    }
    case "redo": S.redoConfirm = true; render(); break;
    case "redoNo": S.redoConfirm = false; render(); break;
    case "redoYes":
      S.done = false; S.redoConfirm = false; S.touched = true; S.pos = 0; save();
      S.view = "quiz"; render(); window.scrollTo(0, 0); break;
  }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.matches && t.matches("textarea[data-q]")) {
    const q = QMAP[t.dataset.q];
    S.answers[q.id] = t.value; S.touched = true;
    const nb = document.getElementById("nextBtn");
    if (nb && !q.optional) nb.disabled = !t.value.trim();
  }
});

init();
})();
</script>
